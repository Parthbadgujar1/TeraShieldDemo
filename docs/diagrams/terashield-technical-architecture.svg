<text x="1084" y="584" font-size="16" font-weight="700" fill="#fff">Live services called directly from the browser</text>
<text x="1084" y="618" font-size="12.6" fill="#1d2a38">• Open-Meteo forecast + GloFAS river discharge   • Overpass (OSM counts, villages)</text>
<text x="1084" y="636.6" font-size="12.6" fill="#1d2a38">• OSRM road routing   • Esri / OSM tiles   • Google Maps embed (keyless)</text>
<text x="1084" y="655.2" font-size="12.6" fill="#1d2a38">Timeouts → cached last-known-good + banner; never invented values</text>
<path d="M1320,560 L1320,534" fill="none" stroke="#f57c00" stroke-width="2.4" marker-end="url(#a)"/>
<text x="1334" y="552" font-size="12" fill="#f57c00" text-anchor="start" font-weight="700">live + cached</text>
<rect x="400" y="560" width="300" height="130" rx="10" fill="#f0f7f1" stroke="#138808" stroke-width="1.6"/>
<rect x="400" y="560" width="300" height="36" rx="10" fill="#138808"/><rect x="400" y="582" width="300" height="14" fill="#138808"/>
<text x="414" y="584" font-size="16" font-weight="700" fill="#fff">Quality &amp; delivery</text>
<text x="414" y="618" font-size="12.6" fill="#1d2a38">• GitHub Actions: type-check,</text>
<text x="414" y="636.6" font-size="12.6" fill="#1d2a38">  66 frontend + 56 backend tests, build</text>
<text x="414" y="655.2" font-size="12.6" fill="#1d2a38">• Push to main → Vercel auto-deploy</text>
<path d="M550,560 L550,534" fill="none" stroke="#138808" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="760" y="560" width="250" height="130" rx="10" fill="#eef3fa" stroke="#0b3d6e" stroke-width="1.6"/>
<rect x="760" y="560" width="250" height="36" rx="10" fill="#0b3d6e"/><rect x="760" y="582" width="250" height="14" fill="#0b3d6e"/>
<text x="774" y="584" font-size="16" font-weight="700" fill="#fff">Deployment</text>
<text x="774" y="618" font-size="12.6" fill="#1d2a38">• Vercel, Root Directory frontend</text>
<text x="774" y="636.6" font-size="12.6" fill="#1d2a38">• No env vars, no API keys</text>
<text x="774" y="655.2" font-size="12.6" fill="#1d2a38">• vercel.json: SPA rewrite + caching</text>
<path d="M885,560 L885,534" fill="none" stroke="#0b3d6e" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="40" y="560" width="300" height="130" rx="10" fill="#f4f4f6" stroke="#5a6b7b" stroke-width="1.6" stroke-dasharray="7 5"/>
<rect x="40" y="560" width="300" height="36" rx="10" fill="#5a6b7b"/><rect x="40" y="582" width="300" height="14" fill="#5a6b7b"/>
<text x="54" y="584" font-size="16" font-weight="700" fill="#fff">Optional backend (not deployed)</text>
<text x="54" y="618" font-size="12.6" fill="#1d2a38">• FastAPI pilot engine, PostGIS schema</text>
<text x="54" y="636.6" font-size="12.6" fill="#1d2a38">• Chamoli + Kendrapara pilots</text>
<text x="54" y="655.2" font-size="12.6" fill="#1d2a38">• Kept for the production path</text>
<rect x="40" y="716" width="1530" height="110" rx="12" fill="#ffffff" stroke="#c9d6e3"/>
<text x="60" y="746" font-size="13" fill="#0b3d6e" text-anchor="start" font-weight="800">PRODUCTION PATH  (what changes when it goes operational)</text>
<text x="60" y="774" font-size="13.5" fill="#1d2a38" text-anchor="start" font-weight="400">• Identity: SDMA single sign-on, roles</text>
<text x="60" y="796" font-size="13.5" fill="#1d2a38" text-anchor="start" font-weight="400">• Server: PostGIS + API, append-only register</text>
<text x="445" y="774" font-size="13.5" fill="#1d2a38" text-anchor="start" font-weight="400">• Feeds: IMD / CWC / SACHET via proxy</text>
<text x="445" y="796" font-size="13.5" fill="#1d2a38" text-anchor="start" font-weight="400">• Ground truth: GSI inventory, field surveys</text>
<text x="830" y="774" font-size="13.5" fill="#1d2a38" text-anchor="start" font-weight="400">• Data: habitation master list, Bhulekh,</text>
<text x="830" y="796" font-size="13.5" fill="#1d2a38" text-anchor="start" font-weight="400">• forest boundaries, UDISE+, HFR facilities</text>
<text x="1215" y="774" font-size="13.5" fill="#1d2a38" text-anchor="start" font-weight="400">• Hosting: NIC / gov cloud, CERT-In audit,</text>
<text x="1215" y="796" font-size="13.5" fill="#1d2a38" text-anchor="start" font-weight="400">• DPDP Act compliance, offline field app</text>
