<path d="M642,246.0 L666,246.0" fill="none" stroke="#0b3d6e" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M957,246.0 L981,246.0" fill="none" stroke="#0b3d6e" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M1272,246.0 L1296,246.0" fill="none" stroke="#0b3d6e" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M1442.5,364 L1442.5,436" fill="none" stroke="#0b3d6e" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M1298,556.0 L1274,556.0" fill="none" stroke="#0b3d6e" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M983,556.0 L959,556.0" fill="none" stroke="#0b3d6e" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M668,556.0 L644,556.0" fill="none" stroke="#0b3d6e" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M812.5,364 L812.5,396 L182.5,396 L182.5,436" fill="none" stroke="#f57c00" stroke-width="2.4" marker-end="url(#a)"/>
<text x="194.5" y="389" font-size="12.5" fill="#f57c00" text-anchor="start" font-weight="700">alerts trigger evacuation planning (hours-days)</text>
<path d="M497.5,674 L497.5,702 L970,702 L970,326 L981,326" fill="none" stroke="#d32f2f" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#r)"/>
<text x="509.5" y="722" font-size="12.5" fill="#d32f2f" text-anchor="start" font-weight="700">feedback: new evidence re-scores zones - they ratchet up freely, down only with evidence + officer sign-off</text>
<rect x="40" y="750" width="1545" height="150" rx="12" fill="#ffffff" stroke="#c9d6e3"/>
<text x="60" y="780" font-size="13" fill="#0b3d6e" text-anchor="start" font-weight="800">WHO USES IT</text>
<rect x="60" y="792" width="250" height="26" rx="13" fill="#0b3d6e"/><text x="185.0" y="810" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fff">SDMA analyst · builds the plan</text>
<rect x="60" y="826" width="250" height="26" rx="13" fill="#138808"/><text x="185.0" y="844" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fff">District Collector · approves &amp; notifies</text>
<rect x="60" y="860" width="250" height="26" rx="13" fill="#f57c00"/><text x="185.0" y="878" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fff">Emergency team · runs evacuation</text>
<text x="350" y="780" font-size="13" fill="#0b3d6e" text-anchor="start" font-weight="800">WHAT COMES OUT</text>
<text x="350" y="806" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Hazard tiers for 594 districts</text>
<text x="350" y="827" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Habitation-level red / orange polygons</text>
<text x="350" y="848" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Ranked relocation lists by horizon</text>
<text x="350" y="869" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Budgeted plan: CSV · GeoJSON · PDF</text>
<text x="350" y="890" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Tamper-evident decision register</text>
<text x="760" y="780" font-size="13" fill="#0b3d6e" text-anchor="start" font-weight="800">DESIGN RULES</text>
<text x="760" y="806" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• A district is a screening tier, never a red zone</text>
<text x="760" y="827" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Forecasts only raise alerts; baselines change on evidence</text>
<text x="760" y="848" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Evacuation ≠ relocation: two tracks, two timelines</text>
<text x="760" y="869" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Hard rejects beat weighted scores</text>
<text x="760" y="890" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Every figure says live / Census / proxy / needs survey</text>
<text x="1250" y="780" font-size="13" fill="#0b3d6e" text-anchor="start" font-weight="800">PILOT → SCALE</text>
<text x="1250" y="806" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Add a district: run one script</text>
<text x="1250" y="827" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Bring your own data: CSV / GeoJSON</text>
<text x="1250" y="848" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Static site: no server needed</text>
<text x="1250" y="869" font-size="14" fill="#1d2a38" text-anchor="start" font-weight="400">• Production: SSO + server register</text>
</svg>